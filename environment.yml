# Create a new environment by
# $ cd iseult-dir-here
# $ conda env create
#
# To update the environment:
# $ cd iseult-dir-here
# $ conda env update --prune
#
# To recreate from scratch
# $ cd iseult-dir-here
# $ conda env create --force

name: iseult
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Python language things
  - python>=3.11
  - pytest>=8.3
  # Numerical/Data tools
  - numpy>=1.26
  - numba>=0.60
  # Scientific Packages
  - scipy>=1.14
  # File Handling
  - h5py>=3.11
  - pyyaml>=6.0
  # Plotting. matplotlib-base leaves out matplotlib's own choice of Qt; Iseult
  # uses PySide6 (Qt 6).
  - matplotlib-base=3.7
  - pyside6>=6.5
